server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ {
        proxy_pass http://convertx:3000;
        proxy_set_header Host $host;
        client_max_body_size 2g;
        proxy_request_buffering off;
    }
}